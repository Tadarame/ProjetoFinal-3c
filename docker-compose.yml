services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instaclone_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - instaclone

  nginx:
    image: nginx:alpine
    container_name: instaclone_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - instaclone

  db:
    image: mysql:8.0
    container_name: instaclone_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: insta_clone
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: laravel
      MYSQL_USER: dev
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - instaclone

  frontend:
      build:
        context: ./frontend
        dockerfile: dockerfile
      container_name: instaclone_frontend
      restart: unless-stopped
      volumes:
        - ./frontend:/app
        - /app/node_modules
      ports:
        - "5173:5173"
      networks:
        - instaclone

volumes:
  dbdata:

networks:
  instaclone:
    driver: bridge